name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

jobs:
  # 主构建：原生 aarch64 runner（ubuntu-24.04-arm），无需交叉工具链
  build-aarch64:
    name: build (aarch64, native runner)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          # 注意：不要缓存 vendor/ 下的 target —— restore 会先造出目录，
          # 让随后的 git clone 因「目标非空」失败
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: ${{ runner.os }}-arm64-${{ hashFiles('src/mt5700-web/Cargo.toml', 'patches/*.patch') }}

      - name: 拉取上游（pin 提交）
        run: make deps

      - name: 编译（两个二进制，本机架构）
        run: TARGET= make build

      - name: 组装分发包
        run: TARGET= make dist

      - name: 校验产物
        run: |
          file build/out/host/*
          build/out/host/mt5700-web --version
          ./build/out/host/at-webserver-rust --version || true
          tar tzf build/*.tar.gz | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-mt5700-panel-aarch64
          path: |
            build/*.tar.gz
            build/*.tar.gz.sha256
          if-no-files-found: error

  # 交叉编译校验（x86_64 → aarch64）：验证交叉链路可用，失败不阻塞
  build-cross:
    name: build (aarch64, cross-check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: 安装交叉工具链
        run: |
          sudo apt-get update
          # crt*.o 来自 libc6-dev-*-cross，缺它会报 "cannot find Scrt1.o / crti.o"
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross file
      - run: make deps
      - run: make build
      - run: make dist
      - run: file build/out/$TARGET/*
      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-mt5700-panel-aarch64-cross
          path: |
            build/*.tar.gz
            build/*.tar.gz.sha256
          if-no-files-found: warn

  release:
    name: release
    # 两个构建 job 任一成功即可发版（native 为主，cross 兜底）
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-aarch64, build-cross ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h5000m-mt5700-panel-*
          merge-multiple: true
          path: build
      - name: 检查产物
        run: |
          ls -l build || true
          test -n "$(ls build/*.tar.gz 2>/dev/null)" || { echo "没有可用产物，跳过发版"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.tar.gz
            build/*.tar.gz.sha256
          generate_release_notes: true
          body: |
            MT5700M 面板（Debian/Linux 移植）—— 覆盖安装包。

            ```sh
            sha256sum -c *.tar.gz.sha256
            tar xzf h5000m-mt5700-panel-*.tar.gz -C /
            systemctl daemon-reload
            systemctl enable --now at-webserver mt5700-web
            ```
            访问 `http://<设备IP>:8181/`。
